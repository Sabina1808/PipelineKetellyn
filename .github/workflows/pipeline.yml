name: Pipeline Fatec

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        env:
          PYTHONPATH: .
        run: python -m pytest -v

  codeql:
    name: CodeQL (análise do código)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Executar análise do CodeQL
        uses: github/codeql-action/analyze@v3

  segredos:
    name: Busca de segredos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Verificar se há chaves expostas
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Deploy no staging
    needs: [testes, codeql, segredos]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Guardar o pacote
        uses: actions/upload-artifact@v7
        with:
          name: app-staging
          path: app.py

      - name: Publicar no staging (simulado)
        env:
          AMBIENTE: ${{ vars.APP_ENV }}
        run: |
          echo "Publicando o commit ${{ github.sha }} no ambiente: $AMBIENTE"
          echo "Deploy concluído com sucesso (simulado)."